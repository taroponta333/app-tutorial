name: Build Universal Converter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. 必要最低限のシステム工具をインストール
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libltdl-dev libffi-dev libssl-dev cmake

      # 2. 一般ユーザー(builder)を作って超高速ビルドを実行
      - name: Build APK as non-root user
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        run: |
          sudo useradd -m builder
          sudo chown -R builder:builder $GITHUB_WORKSPACE
          
          sudo -u builder -i bash << 'EOF'
          cd $GITHUB_WORKSPACE
          
          # 💡 【今回の勝利ポイント①】最新コンパイラ(Clang)の厳しいエラーチェックを全て無効化する魔法のフラグ
          # 古いC言語の書き方（OpenSSLなど）をエラーにせず、警告(Warning)として無理やりスルーさせます。
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
          export LDFLAGS="-Wno-error"
          
          pip3 install --user buildozer cython
          export PATH=$PATH:/home/builder/.local/bin
          
          buildozer init
          
          # アプリの設定
          sed -i 's/package.domain = org.test/package.domain = com.universal.converter/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ufc_converter/' buildozer.spec
          
          # 既製バイナリを使用（Pillowとffmpeg-pythonだけを材料にする）
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow,ffmpeg-python/' buildozer.spec
          
          # Android用のコンパイル済みFFmpegバイナリを直接アプリのlibsに投入
          mkdir -p libs/arm64-v8a
          curl -L -o libs/arm64-v8a/libffmpeg.so https://github.com
          sed -i 's/#android.add_libs_arm64_v8a =/android.add_libs_arm64_v8a = libs\/arm64-v8a\/libffmpeg.so/' buildozer.spec
          
          # 突っ切る！
          yes | buildozer android debug
          EOF

      # 3. 完成したAPKを提出
      - name: Upload Universal Converter APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Universal-Converter-APK
          path: bin/*.apk
