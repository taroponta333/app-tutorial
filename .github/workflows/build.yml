name: Build 真UFC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なシステム依存パッケージのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libssl-dev gdb lcov pkg-config \
            libbz2-dev libffi-dev libgdbm-dev libgdbm-compat-dev liblzma-dev \
            libncurses5-dev libreadline-dev libsqlite3-dev sqlite3 img2pdf \
            lzma lzma-dev tcl-dev tk-dev uuid-dev xvfb zlib1g-dev cython3 \
            openjdk-17-jdk zip unzip wget

      - name: Buildozer と Cython のインストール
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Android APK のビルド実行
        run: |
          buildozer android debug

      - name: 完成した APK を保存 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TrueUFC-arm64-APK
          path: bin/*.apk
