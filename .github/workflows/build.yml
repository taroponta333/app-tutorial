name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Buildozer Docker Image
        run: docker pull culand/buildozer:latest

      - name: Build with Buildozer
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostculand culand/buildozer:latest init
          sed -i 's/package.domain = org.test/package.domain = com.mygame/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = mininggame/' buildozer.spec
          docker run --rm -v ${{ github.workspace }}:/home/user/hostculand culand/buildozer:latest android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiningGame-APK
          path: bin/*.apk
