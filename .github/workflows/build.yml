name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なシステム依存パッケージのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libssl-dev gdb lcov pkg-config \
            libbz2-dev libffi-dev libgdbm-dev libgdbm-compat-dev liblzma-dev \
            libncurses5-dev libreadline-dev libsqlite3-dev sqlite3 img2pdf \
            lzma lzma-dev tcl-dev tk-dev uuid-dev xvfb zlib1g-dev cython3 \
            openjdk-17-jdk zip unzip wget

      # ★ ここがポイント！ 70MBのFFmpegをビルド時に直接取得する
      - name: FFmpeg (arm64-v8a) バイナリの自動取得
        run: |
          echo "⬇️ Android(arm64)用FFmpegをダウンロード中..."
          # BtbN氏の信頼できる事前ビルド済みFFmpeg staticバイナリを取得
          wget https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.0-latest-android-arm64-v8a-gpl-7.0.tar.xz -O ffmpeg-android.tar.xz
          tar -xf ffmpeg-android.tar.xz
          # 展開されたフォルダから ffmpeg 実行ファイルだけをカレントディレクトリに抽出
          cp ffmpeg-*-android-arm64-v8a-gpl-*/bin/ffmpeg ./ffmpeg
          chmod +x ./ffmpeg
          echo "✅ FFmpegバイナリの配置完了！"

      - name: Buildozer と Cython のインストール
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Android APK のビルド実行
        run: |
          buildozer android debug

      - name: 完成した APK を保存 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OfflineConverter-arm64-APK
          path: bin/*.apk
