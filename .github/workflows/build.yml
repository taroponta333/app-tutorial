name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Generate buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Universal Format Converter
          package.name = ufc
          package.domain = org.ufc.app
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0.0

          # Python & Java dependencies
          requirements = python3,kivy,pillow,pyjnius

          # FFmpeg-Kit AAR Integration (embedded ffmpeg arm64 binary)
          android.gradle_dependencies = com.arthenica:ffmpeg-kit-full:5.1

          # Target Architectures
          android.archs = arm64-v8a, armeabi-v7a

          # API & Permissions
          android.api = 33
          android.minapi = 24
          android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          # Auto accept SDK licenses
          android.accept_sdk_license = True
          android.skip_update = False

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UFC-arm64-debug-apk
          path: bin/*.apk
