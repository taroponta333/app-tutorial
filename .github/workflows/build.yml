name: Build Universal Converter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Buildozer Docker Image
        run: docker pull kivy/buildozer:latest

      - name: Build and Configure Universal Tools
        run: |
          # 1. まずは設定ファイル（buildozer.spec）を正しく作成する
          docker run --rm -v ${{ github.workspace }}:/home/user/hostculand -w /home/user/hostculand kivy/buildozer:latest init
          
          # 2. 作成された設定ファイルの中身を書き換える
          sed -i 's/package.domain = org.test/package.domain = com.universal.converter/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ufc_converter/' buildozer.spec
          
          # 全部盛り設定：画像(pillow) と 動画・音声(ffmpeg-python) を同時に組み込む
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow,ffmpeg-python/' buildozer.spec
          
          # 3. 【本番】--allow-rootを最後につけてAPKを組み立てる
          docker run --rm -v ${{ github.workspace }}:/home/user/hostculand -w /home/user/hostculand kivy/buildozer:latest android debug --allow-root

      - name: Upload Universal Converter APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Universal-Converter-APK
          path: bin/*.apk
