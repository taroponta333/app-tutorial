name: Build Universal Converter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. 必要工具のインストール
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libltdl-dev libffi-dev libssl-dev cmake

      # 2. 一般ユーザー(builder)を作ってビルドを実行
      - name: Build APK as non-root user
        run: |
          sudo useradd -m builder
          sudo chown -R builder:builder $GITHUB_WORKSPACE
          
          sudo -u builder -i bash << 'EOF'
          cd $GITHUB_WORKSPACE
          
          pip3 install --user buildozer cython
          export PATH=$PATH:/home/builder/.local/bin
          
          buildozer init
          
          sed -i 's/package.domain = org.test/package.domain = com.universal.converter/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ufc_converter/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow,ffmpeg-python/' buildozer.spec
          
          # 💡 【今回の修正ポイント】Googleの利用規約（ライセンス）に自動で全合意する魔法の環境変数をセット
          export ANDROID_LICENSES_AUTO_ACCEPT=y
          
          # ビルド実行
          buildozer android debug
          EOF

      # 3. 完成したAPKを提出
      - name: Upload Universal Converter APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Universal-Converter-APK
          path: bin/*.apk
