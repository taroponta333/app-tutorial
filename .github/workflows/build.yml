name: Build Universal Converter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. FFmpegをソースからビルドするために必要な各種Linux工具をさらに追加
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libltdl-dev libffi-dev libssl-dev cmake gettext yasm nasm

      # 2. 一般ユーザー(builder)を作って超巨大ビルドを決行
      - name: Build APK as non-root user
        run: |
          sudo useradd -m builder
          sudo chown -R builder:builder $GITHUB_WORKSPACE
          
          sudo -u builder -i bash << 'EOF'
          cd $GITHUB_WORKSPACE
          
          pip3 install --user buildozer cython
          export PATH=$PATH:/home/builder/.local/bin
          
          buildozer init
          
          sed -i 's/package.domain = org.test/package.domain = com.universal.converter/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ufc_converter/' buildozer.spec
          
          # 💡 【核心】requirementsに「ffmpeg」のコンパイルレシピを直接追加！
          # これにより、FFmpegのコアバイナリ(.so)がAndroid用にゼロからビルドされ、アプリ内に物理梱包されます。
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow,ffmpeg,ffmpeg-python/' buildozer.spec
          
          # 規約も質問も全て「yes」で埋め尽くして突っ切る！
          yes | buildozer android debug
          EOF

      # 3. 激闘の末に完成した、本物の万能コンバータAPKを提出
      - name: Upload Universal Converter APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Universal-Converter-APK
          path: bin/*.apk
