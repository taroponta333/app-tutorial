name: Build Universal Converter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Python環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. 最初から全部盛り設定の buildozer.spec をその場で作ってしまう
      - name: Create Buildozer Spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/package.domain = org.test/package.domain = com.universal.converter/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ufc_converter/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow,ffmpeg-python/' buildozer.spec

      # 3. ★公式の自動ビルド部品を使って非rootで安全に実行（エラー回避の核心）
      - name: Build APK with Buildozer Action
        uses: ArtemSsh/buildozer-action@v1
        with:
          command: buildozer android debug
          repository_root: .

      # 4. 完成したAPKを提出
      - name: Upload Universal Converter APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Universal-Converter-APK
          path: bin/*.apk
